name: Verify and release

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      COMPOSER: ${{ github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Release v') && 'composer.json' || '.composer-integration.json' }}
    strategy:
      fail-fast: false
      matrix:
        php: ['8.5.13', '8.5']
    steps:
      - uses: actions/checkout@v7
      - name: Checkout current CQRS 5 compatibility source
        if: ${{ env.COMPOSER == '.composer-integration.json' }}
        uses: actions/checkout@v7
        with:
          repository: componenta/cqrs
          ref: 16cef01402d08e0fb6498b07169c7a3e71197338
          path: .ci/cqrs
      - name: Checkout current DI 6 compatibility source
        if: ${{ env.COMPOSER == '.composer-integration.json' }}
        uses: actions/checkout@v7
        with:
          repository: componenta/di
          ref: ded9a6dc44db2775c4753e73d9581d70caac6043
          path: .ci/di
      - name: Checkout current Identity compatibility source
        if: ${{ env.COMPOSER == '.composer-integration.json' }}
        uses: actions/checkout@v7
        with:
          repository: componenta/identity
          ref: 3feb94e0d64956ecdf7b22abed4a8bd9f597abeb
          path: .ci/identity
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - name: Configure Composer authentication
        run: composer config --global github-oauth.github.com "${{ github.token }}"
      - run: COMPOSER=composer.json composer validate --strict
      - name: Prepare current dependency graph
        if: ${{ env.COMPOSER == '.composer-integration.json' }}
        shell: bash
        run: |
          for dependency in cqrs di identity; do
            git -C ".ci/$dependency" switch -C fix/callback-dependency-baseline-2026-11-26
          done
          cp composer.json "$COMPOSER"
          composer config --json repositories.componenta-cqrs '{"type":"path","url":".ci/cqrs"}'
          composer config --json repositories.componenta-di '{"type":"path","url":".ci/di"}'
          composer config --json repositories.componenta-identity '{"type":"path","url":".ci/identity"}'
          composer require --no-update \
            componenta/cqrs:dev-fix/callback-dependency-baseline-2026-11-26 \
            componenta/di:dev-fix/callback-dependency-baseline-2026-11-26 \
            componenta/identity:dev-fix/callback-dependency-baseline-2026-11-26
      - run: composer update --with-all-dependencies --no-interaction --prefer-dist --no-progress
      - run: composer test
      - run: composer analyse

  verify-minimum-lock:
    runs-on: ubuntu-latest
    env:
      COMPOSER: ${{ github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Release v') && 'composer.json' || '.composer-integration.json' }}
    steps:
      - uses: actions/checkout@v7
      - name: Checkout current CQRS 5 compatibility source
        if: ${{ env.COMPOSER == '.composer-integration.json' }}
        uses: actions/checkout@v7
        with:
          repository: componenta/cqrs
          ref: 16cef01402d08e0fb6498b07169c7a3e71197338
          path: .ci/cqrs
      - name: Checkout current DI 6 compatibility source
        if: ${{ env.COMPOSER == '.composer-integration.json' }}
        uses: actions/checkout@v7
        with:
          repository: componenta/di
          ref: ded9a6dc44db2775c4753e73d9581d70caac6043
          path: .ci/di
      - name: Checkout current Identity compatibility source
        if: ${{ env.COMPOSER == '.composer-integration.json' }}
        uses: actions/checkout@v7
        with:
          repository: componenta/identity
          ref: 3feb94e0d64956ecdf7b22abed4a8bd9f597abeb
          path: .ci/identity
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5.13'
          coverage: none
          tools: composer:v2
      - name: Configure Composer authentication
        run: composer config --global github-oauth.github.com "${{ github.token }}"
      - run: COMPOSER=composer.json composer validate --strict
      - name: Prepare current dependency graph
        if: ${{ env.COMPOSER == '.composer-integration.json' }}
        shell: bash
        run: |
          for dependency in cqrs di identity; do
            git -C ".ci/$dependency" switch -C fix/callback-dependency-baseline-2026-11-26
          done
          cp composer.json "$COMPOSER"
          composer config --json repositories.componenta-cqrs '{"type":"path","url":".ci/cqrs"}'
          composer config --json repositories.componenta-di '{"type":"path","url":".ci/di"}'
          composer config --json repositories.componenta-identity '{"type":"path","url":".ci/identity"}'
          composer require --no-update \
            componenta/cqrs:dev-fix/callback-dependency-baseline-2026-11-26 \
            componenta/di:dev-fix/callback-dependency-baseline-2026-11-26 \
            componenta/identity:dev-fix/callback-dependency-baseline-2026-11-26
      - run: composer require --no-update symfony/lock:8.1.0
      - run: composer update --with-all-dependencies --no-interaction --prefer-dist --no-progress
      - run: composer test
      - run: composer analyse

  publish:
    if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Release v')
    needs: [verify, verify-minimum-lock]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          first_line="${COMMIT_MESSAGE%%$'\n'*}"
          tag="${first_line#Release }"
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $tag" >&2
            exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists."
            exit 0
          fi
          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --generate-notes
